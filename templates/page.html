<!doctype html>
<!-- Template for every page. scripts/build-site.mjs fills the {{...}} slots;
     scripts/dev-server.mjs does the same on the fly for local work. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />{{ROBOTS}}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0d0a1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Watchlist" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css?v={{V}}" />
</head>
<body data-owner="false">
  <a class="skip" href="#app">Skip to the list</a>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="/" aria-label="Watchlist home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Watchlist</span>
        <span class="brand-sub">{{SUBTITLE}}</span>
      </a>
      <label class="search">
        <span class="visually-hidden">Search the list</span>
        <input id="q" type="search" placeholder="Search titles, people, genres…" autocomplete="off" enterkeyhint="search" />
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="topbar-actions">
        <button id="surprise" class="btn btn-ghost" type="button" title="Pick something at random">🎲<span class="btn-label"> Surprise</span></button>
        <button id="add" class="btn btn-primary" type="button"><span aria-hidden="true">+</span> <span class="add-label">Suggest</span></button>
        <button id="menu-btn" class="btn btn-ghost" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Owner and data options">🔒</button>
        <div id="menu" class="menu" hidden>
          <button id="lock" type="button">Unlock owner mode</button>
          <a href="/stats/">Stats</a>
          <button id="export" class="owner-only" type="button">Export data.json</button>
          <label class="owner-only menu-file">Import data.json<input id="import" type="file" accept="application/json" hidden /></label>
        </div>
      </div>
    </div>
    <nav class="pagenav" aria-label="Lists">
{{NAV}}
    </nav>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="footer">
    <span id="count"></span>
    <span id="sync" class="owner-only"></span>
  </footer>

  <nav class="tabbar" aria-label="Primary">
    <a href="/" data-tab="home"><span aria-hidden="true">⌂</span>Home</a>
    <a href="/all/" data-tab="all"><span aria-hidden="true">▦</span>Browse</a>
    <button type="button" id="tab-add"><span aria-hidden="true">＋</span><span class="add-label">Suggest</span></button>
    <a href="/recommended/" data-tab="recommended" class="guest-only"><span aria-hidden="true">★</span>Friends</a>
    <a href="/inbox/" data-tab="inbox" class="owner-only"><span aria-hidden="true">📥</span>Inbox</a>
    <a href="/stats/" data-tab="stats"><span aria-hidden="true">◔</span>Stats</a>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="Item details"></dialog>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>window.WL_PAGE={{PAGE}};</script>
  <script type="module" src="/assets/app.js?v={{V}}"></script>
  <script>if("serviceWorker" in navigator&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))addEventListener("load",()=>navigator.serviceWorker.register("/sw.js",{scope:"/"}));</script>
</body>
</html>
