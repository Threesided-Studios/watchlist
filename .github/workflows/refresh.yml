name: Weekly refresh

# Refreshes facts that change after an item is added: where things stream,
# next episodes and upcoming releases, runtimes, and repository stars and
# releases (scripts/refresh.mjs). Shares the ingest concurrency group so two
# jobs never write data.json at once.
on:
  schedule:
    - cron: "23 9 * * 1"      # Mondays
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: screenshot-ingest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Work from the newest main each attempt and re-run on a lost push race,
      # instead of rebasing a whole-file rewrite of data.json (which conflicts).
      - name: Run, commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/refresh.mjs
            git add data.json
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "Weekly refresh: streaming, upcoming, repos"
            if git push -q origin HEAD:main; then
              gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
              exit 0
            fi
            echo "main moved; retrying"; sleep 5
          done
          exit 1
