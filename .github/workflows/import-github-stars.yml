name: Import GitHub stars

# Adds a GitHub user's starred repositories to the list as repos
# (scripts/import-github-stars.mjs). Safe to re-run: existing ones are skipped.
on:
  workflow_dispatch:
    inputs:
      user:
        description: "GitHub username"
        default: "adamaragon"
  schedule:
    - cron: "47 10 * * 1"     # Mondays: pick up anything starred since

permissions:
  contents: write
  actions: write

concurrency:
  group: screenshot-ingest
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Work from the newest main each attempt and re-run on a lost push race,
      # instead of rebasing a whole-file rewrite of data.json (which conflicts).
      - name: Run, commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/import-github-stars.mjs "${{ inputs.user || 'adamaragon' }}"
            git add data.json
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "Import GitHub stars"
            if git push -q origin HEAD:main; then
              gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
              exit 0
            fi
            echo "main moved; retrying"; sleep 5
          done
          exit 1
