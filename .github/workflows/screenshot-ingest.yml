name: Screenshot ingest

# Pulls iPhone screenshots queued at the watchlist-ingest Worker, AI-parses them
# for movie/show/anime/book/game titles, and commits new items to data.json
# (confident matches go on the list; unsure ones go to /inbox/ for review).
# Also applies Keep/Dismiss decisions made in the inbox.
on:
  schedule:
    - cron: "41 * * * *"      # hourly
  # The Worker sends this a couple of minutes after a screenshot or an owner
  # edit arrives, so changes land without waiting for the schedule.
  repository_dispatch:
    types: [watchlist-ingest]
  workflow_dispatch:
    inputs:
      limit:
        description: "Max screenshots this run"
        default: "40"

permissions:
  contents: write
  actions: write              # keepalive: re-enable this schedule so it never idles out

concurrency:
  group: screenshot-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Quick check for work
        id: peek
        env:
          QK: ${{ secrets.WATCHLIST_QUEUE_KEY }}
        run: |
          s=$(curl -fsS https://watchlist-ingest.threesided.workers.dev/status)
          echo "$s"
          q=$(echo "$s" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["queued"]+d["reviews"]+d.get("edits",0))')
          echo "work=$q" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.peek.outputs.work != '0'
        working-directory: scripts/ingest
        run: npm install --no-audit --no-fund
      - name: Apply owner edits
        if: steps.peek.outputs.work != '0'
        working-directory: scripts/ingest
        env:
          WATCHLIST_QUEUE_KEY: ${{ secrets.WATCHLIST_QUEUE_KEY }}
        run: node apply-edits.mjs
      - name: Parse screenshots
        if: steps.peek.outputs.work != '0'
        working-directory: scripts/ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}   # GitHub repo search for software matches
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}        # music and podcast matches
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}           # optional: addresses for places
          WATCHLIST_QUEUE_KEY: ${{ secrets.WATCHLIST_QUEUE_KEY }}
          # Normal caps (backfill of 2026-10-10 finished; raise temporarily for big imports).
          INGEST_LIMIT: ${{ inputs.limit || '40' }}
          MAX_RUN_USD: "2"
          INGEST_CONCURRENCY: "4"
          INGEST_MAX_MINUTES: "20"
        run: node run.mjs
      # Idempotent: keeps every item in the current data shape (shared/normalize.js).
      - name: Normalise data
        run: node scripts/normalize.mjs
      - name: Commit
        run: |
          git add data.json posters scripts/ingest/ledger.json
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git config user.name "watchlist-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add titles from screenshots"
            ok=0
            for i in 1 2 3; do if git pull --rebase -q && git push; then ok=1; break; fi; sleep 5; done
            [ "$ok" = 1 ] || { echo "push failed; leaving screenshots queued for the next run"; exit 1; }
          fi
      - name: Ack processed screenshots and edits
        if: steps.peek.outputs.work != '0'
        working-directory: scripts/ingest
        env:
          WATCHLIST_QUEUE_KEY: ${{ secrets.WATCHLIST_QUEUE_KEY }}
        run: node run.mjs --ack
      # Runs every time, not only after a commit, so a missed or failed deploy
      # heals itself on the next run instead of leaving the site stale.
      - name: Deploy if the live site is behind main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          live=$(curl -fsS -m 20 "https://watch.threesided.com/version.json?t=$(date +%s)" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' 2>/dev/null || true)
          echo "main=$head live=${live:-unknown}"
          if [ -n "$head" ] && [ "$head" != "$live" ]; then
            gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
            echo "Started a site deploy."
          else
            echo "Live site is current."
          fi
      # A run reads a capped batch. If more is waiting (a backfill), start the
      # next run now instead of leaving it for the schedule.
      - name: Continue if the queue is not empty
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(curl -fsS https://watchlist-ingest.threesided.workers.dev/status | python3 -c 'import json,sys;print(json.load(sys.stdin)["queued"])' || echo 0)
          echo "still queued: $left"
          if [ "$left" -gt 0 ] && [ "${{ steps.peek.outputs.work }}" != "0" ]; then
            gh workflow run screenshot-ingest.yml --repo "${{ github.repository }}" --ref main
          fi
      - name: Keepalive (GitHub disables idle schedules after 60 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/screenshot-ingest.yml/enable" || true
