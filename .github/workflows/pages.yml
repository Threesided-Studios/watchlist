name: Deploy site

# Replaces GitHub's built-in "pages build and deployment", which uploaded the
# whole repo (~215 MB) as a github-pages artifact on every push and filled the
# org's Actions artifact storage. This uploads only the files the site serves,
# keeps the artifact for 1 day, and deletes it as soon as the deploy finishes.
on:
  push:
    branches: [main]
  # Bot commits pushed with GITHUB_TOKEN don't fire `push`, so the jobs that
  # commit new titles start this workflow themselves (`gh workflow run
  # pages.yml`, which GITHUB_TOKEN is allowed to do). The earlier `workflow_run`
  # trigger never fired, which left the live site frozen while data.json grew.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage site files only
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'scripts' --exclude 'pipeline' --exclude 'docs' \
            --exclude 'worker' --exclude 'ingest-worker' \
            --exclude 'node_modules' --exclude 'README.md' --exclude '.gitignore'
          touch _site/.nojekyll
          # Which commit is live. The ingest job reads this to notice a stale site.
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" > _site/version.json
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: [build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete this run's github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"
          done
